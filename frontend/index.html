<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/src/assets/brand/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="PR Per Hour" />
    <meta property="og:site_name" content="PR Per Hour" />

    />
    <meta
      property="og:title"
      content="PR Per Hour | Strategic Communication, Public Relations & Consultations"
    />
    <meta
      property="og:description"
      content="PR Per Hour provides strategic communication, public relations, consultations, and professional communication solutions for organizations and institutions."
    />
    <meta
      name="twitter:title"
      content="PR Per Hour | Strategic Communication, Public Relations & Consultations"
    />
    <meta
      name="twitter:description"
      content="PR Per Hour provides strategic communication, public relations, consultations, and professional communication solutions for organizations and institutions."
    />
    <title>
      PR Per Hour | Strategic Communication &amp; Public Relations Consultancy
    </title>
    <script>
      (function () {
        try {
          var THEME_KEY = 'prph.theme'
          var LOCALE_KEY = 'prph.locale'
          var storedTheme = localStorage.getItem(THEME_KEY)
          var resolved =
            storedTheme === 'light' || storedTheme === 'dark'
              ? storedTheme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          // Normalize legacy "system" / missing values to an explicit Light or Dark.
          if (storedTheme !== resolved) {
            localStorage.setItem(THEME_KEY, resolved)
          }
          document.documentElement.setAttribute('data-theme', resolved)
          document.documentElement.setAttribute('data-theme-preference', resolved)

          var storedLocale = localStorage.getItem(LOCALE_KEY)
          var locale = storedLocale === 'ar' ? 'ar' : 'en'
          document.documentElement.lang = locale
          document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr'
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
          document.documentElement.setAttribute('data-theme-preference', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
